name: Stock Pipeline

on:
  schedule:
    - cron: '*/30 13-20 * * 1-5'  # every 30 min, 9:30am-4pm ET (UTC-4)
  workflow_dispatch:                # also lets you trigger it manually

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python src/orchestration/pipeline.py --force

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/ data/processed/
          git diff --staged --quiet || git commit -m "pipeline run $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push